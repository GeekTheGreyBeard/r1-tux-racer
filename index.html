<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101e34"><title>Snowline Sprint</title><link rel="stylesheet" href="style.css"></head><body><main id="shell" aria-label="Snowline Sprint game"><canvas id="scene" width="240" height="282" aria-label="Downhill game course"></canvas><div class="hud" id="hud" hidden><div class="hud-top"><span id="courseHud">PINEWAKE</span><span id="timer">00:00</span></div><div class="meter"><div id="progress"></div></div><div class="hud-bottom"><span id="fishHud">◆ 0/5</span><span id="gateHud">◇ 0/7</span><span id="speedHud">14 m/s</span></div><div class="stamina"><div id="staminaFill"></div></div><div id="boostHud">⚡ 2 BOOSTS</div></div><div id="notice" aria-live="polite"></div><div class="controls" id="controls" hidden><button id="left" aria-label="Steer left">◀</button><button id="brake" aria-label="Hold to brake">BRAKE</button><button id="jump" aria-label="Jump">JUMP</button><button id="boost" aria-label="Boost">⚡</button><button id="right" aria-label="Steer right">▶</button></div><button id="pause" class="pause" aria-label="Pause race" hidden>Ⅱ</button><section class="panel" id="panel"><div class="eyebrow">AN ORIGINAL MOUNTAIN ARCADE</div><h1>SNOWLINE<br><em>SPRINT</em></h1><p id="description">25 alpine descents. Thread the gates, gather fish, and outrun the clock.</p><div class="course-picker" id="picker"></div><button class="primary" id="primary">START DESCENT <span>↗</span></button><button class="secondary" id="menuButton" hidden>COURSE MENU</button><p class="tip" id="tip">Tilt to steer · touch arrows if tilt is unavailable<br>Brake to carve · jump rocks · boost on straights</p></section></main><script type="module" src="game.js"></script></body></html>
